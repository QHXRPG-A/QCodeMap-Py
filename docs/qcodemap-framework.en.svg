<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1000" viewBox="0 0 1640 1000" role="img" aria-labelledby="title desc">
  <title id="title">QCodeMap: semantic code navigation for any Python codebase</title>
  <desc id="desc">A source repository is converted into a reusable SQLite semantic fact index that an AI agent queries in layers. The diagram also shows the evolution from codemap and Jedi with pyi stubs to QCodeMap's fact index.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.52" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="footer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.5" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#cbd5e1" opacity="0.45"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L6 3L0 6z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L6 3L0 6z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L6 3L0 6z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .major-title { font-size: 29px; font-weight: 600; fill: #ffffff; }
      .card-title { font-size: 23px; font-weight: 600; fill: #0f172a; }
      .body { font-size: 18px; fill: #475569; }
      .small { font-size: 16px; fill: #64748b; }
      .method-title { font-size: 21px; font-weight: 600; fill: #0f172a; }
      .connector { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1640" height="1000" fill="#f8fafc"/>
  <rect y="112" width="1640" height="888" fill="url(#dots)"/>

  <!-- Header -->
  <rect width="1640" height="112" fill="url(#header)"/>
  <text x="66" y="53" font-size="35" font-weight="600" fill="#ffffff">QCodeMap: Semantic Code Navigation for Any Python Codebase</text>
  <text x="66" y="86" font-size="19" fill="#dbeafe">codemap + Jedi + .pyi stubs</text>

  <!-- Source repository -->
  <g filter="url(#shadow)">
    <rect x="60" y="170" width="350" height="680" rx="26" fill="#ffffff" stroke="#5eead4" stroke-width="2"/>
    <path d="M60 196a26 26 0 0 1 26-26h298a26 26 0 0 1 26 26v96H60z" fill="#0f766e"/>
    <circle cx="118" cy="230" r="34" fill="#ffffff" opacity="0.18"/>
    <path d="M102 215h24l12 12v28h-36zM126 215v13h12" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <text x="166" y="220" class="major-title">Source code</text>
    <text x="166" y="254" font-size="15" fill="#ccfbf1">Any Python repo · read-only scan</text>
  </g>

  <text x="96" y="342" class="card-title">Raw facts</text>
  <rect x="92" y="370" width="286" height="88" rx="15" fill="#ecfdf5"/>
  <circle cx="119" cy="400" r="9" fill="#14b8a6"/>
  <text x="142" y="407" font-size="16" fill="#475569">Files, directories, imports</text>
  <circle cx="119" cy="431" r="9" fill="#14b8a6"/>
  <text x="142" y="438" font-size="16" fill="#475569">Classes, functions, calls, names</text>

  <text x="96" y="506" font-size="20" font-weight="600" fill="#0f172a">Dynamic framework patterns</text>
  <rect x="92" y="534" width="286" height="128" rx="15" fill="#f0fdfa"/>
  <text x="116" y="566" font-size="16" fill="#475569">Component injection</text>
  <text x="116" y="593" font-size="16" fill="#475569">Declarative properties</text>
  <text x="116" y="620" font-size="16" fill="#475569">Runtime globals</text>
  <text x="116" y="647" font-size="16" fill="#475569">String-based RPC</text>

  <rect x="92" y="720" width="286" height="82" rx="16" fill="#ccfbf1"/>
  <path d="M116 755l10 10 20-24" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="750" font-size="18" font-weight="600" fill="#0f766e">Read-only boundary</text>
  <text x="160" y="778" font-size="13" fill="#64748b">No stubs or caches written to source</text>

  <!-- Indexing approach evolution -->
  <text x="446" y="190" font-size="22" font-weight="600" fill="#334155">Indexing approaches</text>
  <text x="446" y="216" class="small">Test the limits, then converge</text>

  <g filter="url(#shadow)">
    <rect x="446" y="248" width="272" height="134" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <rect x="446" y="248" width="8" height="134" rx="4" fill="#64748b"/>
    <text x="474" y="282" class="method-title">codemap</text>
    <text x="474" y="313" font-size="17" fill="#475569">Build a structural map quickly</text>
    <text x="474" y="340" class="small">Directories / imports / hubs</text>
    <rect x="474" y="350" width="218" height="24" rx="12" fill="#e2e8f0"/>
    <text x="583" y="368" text-anchor="middle" font-size="14" fill="#475569">Limit: imports only</text>

    <rect x="446" y="430" width="272" height="156" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <rect x="446" y="430" width="8" height="156" rx="4" fill="#ea580c"/>
    <text x="474" y="464" class="method-title">Jedi + .pyi stubs</text>
    <text x="474" y="495" font-size="16" fill="#475569">Add dynamic semantics with stubs</text>
    <text x="474" y="522" font-size="14" fill="#64748b">Validate component/global injection</text>
    <rect x="474" y="538" width="218" height="38" rx="12" fill="#ffedd5"/>
    <text x="583" y="554" text-anchor="middle" font-size="12" fill="#c2410c">Limit: stubs live near source</text>
    <text x="583" y="570" text-anchor="middle" font-size="12" fill="#c2410c">Large repos lose cross-file edges</text>

    <rect x="446" y="642" width="272" height="174" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
    <rect x="446" y="642" width="8" height="174" rx="4" fill="#2563eb"/>
    <text x="474" y="690" class="method-title">QCodeMap fact index</text>
    <text x="474" y="724" class="body">AST scan + name lookup</text>
    <text x="474" y="753" class="body">+ pluggable project facts</text>
    <text x="474" y="785" font-size="15" fill="#64748b">Incremental updates into SQLite</text>
  </g>

  <path class="connector" d="M410 315H440"/>
  <path class="connector" d="M582 382V424"/>
  <path class="connector" d="M582 586V636"/>

  <!-- SQLite index -->
  <g filter="url(#shadow)">
    <rect x="770" y="170" width="350" height="680" rx="26" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
    <path d="M770 196a26 26 0 0 1 26-26h298a26 26 0 0 1 26 26v96H770z" fill="#6d28d9"/>
    <circle cx="828" cy="230" r="34" fill="#ffffff" opacity="0.18"/>
    <ellipse cx="828" cy="217" rx="18" ry="7" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M810 217v26c0 4 8 7 18 7s18-3 18-7v-26M810 230c0 4 8 7 18 7s18-3 18-7" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="876" y="220" class="major-title">SQLite</text>
    <text x="876" y="254" font-size="16" fill="#ede9fe">Regenerable semantic fact index</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="814" y="330" width="262" height="122" rx="24" fill="url(#db)"/>
    <ellipse cx="945" cy="346" rx="112" ry="16" fill="#8b5cf6"/>
    <path d="M833 346v70c0 9 50 16 112 16s112-7 112-16v-70" fill="none" stroke="#c4b5fd" stroke-width="2"/>
    <text x="945" y="385" text-anchor="middle" font-size="25" font-weight="600" fill="#ffffff">Code Fact Store</text>
    <text x="945" y="416" text-anchor="middle" font-size="14" fill="#ede9fe">Structured · queryable · incremental</text>
  </g>

  <text x="808" y="504" class="card-title">What the index stores</text>
  <rect x="806" y="530" width="278" height="58" rx="14" fill="#f5f3ff"/>
  <circle cx="835" cy="559" r="12" fill="#7c3aed"/>
  <text x="835" y="565" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">1</text>
  <text x="862" y="566" font-size="15" fill="#475569">Inverted names: candidates in ms</text>

  <rect x="806" y="600" width="278" height="58" rx="14" fill="#eef2ff"/>
  <circle cx="835" cy="629" r="12" fill="#4f46e5"/>
  <text x="835" y="635" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">2</text>
  <text x="862" y="636" font-size="15" fill="#475569">Files, dependencies, definitions</text>

  <rect x="806" y="670" width="278" height="58" rx="14" fill="#ecfeff"/>
  <circle cx="835" cy="699" r="12" fill="#0891b2"/>
  <text x="835" y="705" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">3</text>
  <text x="862" y="706" font-size="16" fill="#475569">Dynamic framework facts</text>

  <rect x="806" y="740" width="278" height="58" rx="14" fill="#ecfdf5"/>
  <circle cx="835" cy="769" r="12" fill="#059669"/>
  <text x="835" y="775" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">4</text>
  <text x="862" y="776" font-size="15" fill="#475569">Verified edges and query cache</text>

  <path d="M718 728H764" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <text x="741" y="708" text-anchor="middle" font-size="15" font-weight="600" fill="#6d28d9">Persist</text>

  <!-- AI agent -->
  <g filter="url(#shadow)">
    <rect x="1230" y="170" width="350" height="680" rx="26" fill="url(#agent)" stroke="#60a5fa" stroke-width="2"/>
    <path d="M1230 196a26 26 0 0 1 26-26h298a26 26 0 0 1 26 26v96h-350z" fill="#2563eb"/>
    <circle cx="1288" cy="230" r="34" fill="#ffffff" opacity="0.18"/>
    <rect x="1271" y="214" width="34" height="28" rx="8" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="1281" cy="227" r="3" fill="#ffffff"/>
    <circle cx="1295" cy="227" r="3" fill="#ffffff"/>
    <path d="M1288 207v7M1278 250h20M1265 223h6M1305 223h6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="1336" y="220" class="major-title">AI Agent</text>
    <text x="1336" y="254" font-size="15" fill="#dbeafe">Understand code layer by layer</text>
  </g>

  <text x="1266" y="337" font-size="21" font-weight="600" fill="#0f172a">Retrieve context on demand</text>
  <text x="1266" y="368" font-size="16" fill="#475569">Instead of dumping the whole repository:</text>

  <rect x="1264" y="402" width="282" height="82" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="1294" cy="443" r="18" fill="#2563eb"/>
  <text x="1294" y="450" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">1</text>
  <text x="1324" y="435" font-size="18" font-weight="600" fill="#1e3a8a">Start with the big picture</text>
  <text x="1324" y="462" font-size="13" fill="#64748b">Tree, core modules, dependency hubs</text>

  <rect x="1264" y="502" width="282" height="82" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="1294" cy="543" r="18" fill="#2563eb"/>
  <text x="1294" y="550" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">2</text>
  <text x="1324" y="535" font-size="18" font-weight="600" fill="#1e3a8a">Focus on local context</text>
  <text x="1324" y="562" font-size="13" fill="#64748b">File roles, definitions, both directions</text>

  <rect x="1264" y="602" width="282" height="82" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <circle cx="1294" cy="643" r="18" fill="#2563eb"/>
  <text x="1294" y="650" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">3</text>
  <text x="1324" y="635" font-size="18" font-weight="600" fill="#1e3a8a">Trace semantic relationships</text>
  <text x="1324" y="662" font-size="13" fill="#64748b">Calls, RPC, and blast radius</text>

  <rect x="1264" y="724" width="282" height="78" rx="16" fill="#dbeafe"/>
  <path d="M1290 761l9 9 18-22" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1330" y="755" font-size="18" font-weight="600" fill="#1d4ed8">Trustworthy output</text>
  <text x="1330" y="782" font-size="13" fill="#64748b">Confidence + coverage, no silent gaps</text>

  <!-- Bidirectional index interaction -->
  <path d="M1230 405H1126" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="1178" y="389" text-anchor="middle" font-size="15" font-weight="600" fill="#1d4ed8">Query by problem</text>
  <path d="M1120 554H1224" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <text x="1172" y="585" text-anchor="middle" font-size="15" font-weight="600" fill="#6d28d9">Return context</text>

  <!-- Summary -->
  <g filter="url(#shadow)">
    <rect x="190" y="900" width="1260" height="68" rx="22" fill="url(#footer)"/>
    <text x="820" y="943" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff">Map the whole → Focus locally → Verify semantic links → Build evidence-based understanding</text>
  </g>
</svg>
